version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || true
        - npm ci
        - npm run build:shared
    build:
      commands:
        - npm run build:client
  artifacts:
    baseDirectory: client/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - client/.next/cache/**/*
